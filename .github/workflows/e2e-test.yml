name: E2E Test

on:
  workflow_dispatch:
  push:
    paths-ignore:
    - '**.md'
    - 'LICENSE'
    - 'THANKS'
    - 'canary.py'
    - '.gitignore'
    - 'TestConsumers/**'

jobs:
  e2e:
    runs-on: [self-hosted, macOS, ARM64, Apple-M1]
    timeout-minutes: 45
    env:
      XCODE: /Applications/Xcode.app
      XCODE_SDK: iphoneos26.5
      SORA_SIGNALING_URL: ${{ secrets.TEST_SIGNALING_URL }}
      TEST_SECRET_KEY: ${{ secrets.TEST_SECRET_KEY }}
      TEST_CHANNEL_ID_PREFIX: ${{ secrets.TEST_CHANNEL_ID_PREFIX }}
      # 同じ run の e2e job と tsan job が同じチャンネル ID へ接続すると、片方の接続が
      # TIMEOUT で close されてテストが失敗することがあるため、job ごとに分ける
      TEST_CHANNEL_ID_SUFFIX: _${{ github.run_id }}_e2e
      TEST_API_URL: ${{ secrets.TEST_API_URL }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Show Xcode Version
      run: xcodebuild -version
    - name: Setup iOS Simulator
      run: |
        SIMULATOR_NAME="iPhone 17 Pro"

        # デバイスの存在を確認し、存在しなければ作成する
        if ! xcrun simctl list devices available | grep -q "$SIMULATOR_NAME ("; then
          echo "Creating simulator '$SIMULATOR_NAME'"
          xcrun simctl create "$SIMULATOR_NAME" \
            "com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro"
        fi

        # 起動
        xcrun simctl boot "$SIMULATOR_NAME"
        xcrun simctl bootstatus "$SIMULATOR_NAME" -b
    - name: Run E2E Tests
      id: e2e_tests
      # ハングした場合は job 全体の timeout で cancelled になり診断 step が実行されないため、
      # step 単位で打ち切って failure にし、Show E2E Crash Diagnostics を実行させる
      timeout-minutes: 30
      run: |
        rm -rf build

        # Simulator の system log をバックグラウンドで収集する
        xcrun simctl spawn booted log stream --predicate 'processImagePath contains "Sora"' &
        LOG_PID=$!
        trap 'kill $LOG_PID 2>/dev/null || true' EXIT

        set -o pipefail && \
          xcodebuild build-for-testing \
            -scheme Sora-Package \
            -sdk ${{ env.XCODE_SDK }} \
            -derivedDataPath build \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=26.5' \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            PROVISIONING_PROFILE= \
            SWIFT_VERSION=6

        XCTESTRUN=$(find build -name "*.xctestrun" -path "*/Products/*" | head -1)
        if [ ! -f "$XCTESTRUN" ]; then
          echo "Error: .xctestrun not found"
          exit 1
        fi
        echo "Injecting environment variables into $XCTESTRUN"
        plutil -replace TestConfigurations.0.TestTargets.0.EnvironmentVariables \
          -json "{}" "$XCTESTRUN"
        plutil -insert TestConfigurations.0.TestTargets.0.EnvironmentVariables.SORA_SIGNALING_URL \
          -string "$SORA_SIGNALING_URL" "$XCTESTRUN"
        plutil -insert TestConfigurations.0.TestTargets.0.EnvironmentVariables.TEST_SECRET_KEY \
          -string "$TEST_SECRET_KEY" "$XCTESTRUN"
        plutil -insert TestConfigurations.0.TestTargets.0.EnvironmentVariables.TEST_CHANNEL_ID_PREFIX \
          -string "$TEST_CHANNEL_ID_PREFIX" "$XCTESTRUN"
        plutil -insert TestConfigurations.0.TestTargets.0.EnvironmentVariables.TEST_CHANNEL_ID_SUFFIX \
          -string "$TEST_CHANNEL_ID_SUFFIX" "$XCTESTRUN"
        plutil -insert TestConfigurations.0.TestTargets.0.EnvironmentVariables.TEST_API_URL \
          -string "$TEST_API_URL" "$XCTESTRUN"

        xcodebuild test-without-building \
            -xctestrun "$XCTESTRUN" \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=26.5' \
            -resultBundlePath build/e2e.xcresult \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            PROVISIONING_PROFILE=
    - name: Show E2E Crash Diagnostics
      if: failure() && steps.e2e_tests.outcome == 'failure'
      run: |
        if [ ! -d build/e2e.xcresult ]; then
          echo 'No E2E result bundle is available.'
          exit 0
        fi

        # 接続情報や環境変数を含み得る診断全体は公開せず、終了理由・スレッド情報・シンボルだけを
        # 抽出する。export の失敗でこの step を終了させない (job の合否は Run E2E Tests step が持つ)
        if ! xcrun xcresulttool export diagnostics \
          --path build/e2e.xcresult \
          --output-path build/e2e-diagnostics; then
          echo "Warning: failed to export diagnostics"
          exit 0
        fi
        if [ ! -d build/e2e-diagnostics ]; then
          echo "Warning: diagnostics output directory was not created"
          exit 0
        fi

        # report には共有 runner の Simulator に残った過去の実行の crash report も含まれるため、
        # テスト実行 (xcodebuild の test action) を開始した時刻以降に採取された report だけを
        # 表示する。result bundle の作成時刻をテスト実行の開始時刻として使い、取得できない場合は
        # 比較を行わず全件を対象にする (fail-open)
        START_EPOCH=$(stat -f %B build/e2e.xcresult 2>/dev/null || echo 0)
        case "$START_EPOCH" in
          '' | *[!0-9]*) START_EPOCH=0 ;;
        esac

        # .ips は 1 行目がヘッダ (timestamp / app_name)、2 行目以降が本体 (procName /
        # captureTime / threads など) の 2 値構成である。採取時刻にはクラッシュ時刻に近い本体の
        # captureTime を使い、無ければヘッダの timestamp (レポート生成時刻) を使う
        TOTAL=0
        STALE=0
        UNKNOWN=0
        OTHER=0
        TARGET=0
        FAILED=0
        while IFS= read -r -d '' report; do
          TOTAL=$((TOTAL + 1))
          REPORT=$(basename "$report")
          CAPTURED_AT=$(tail -n +2 "$report" | jq -r '.captureTime // empty' 2>/dev/null || true)
          if [ -z "$CAPTURED_AT" ]; then
            CAPTURED_AT=$(head -1 "$report" | jq -r '.timestamp // empty' 2>/dev/null || true)
          fi
          CAPTURED=unknown
          if [ "$START_EPOCH" -gt 0 ] && [ -n "$CAPTURED_AT" ]; then
            # "2026-10-16 20:03:48.9163 +0900" 形式の小数秒を落として epoch 秒へ変換する
            NORMALIZED=$(printf '%s' "$CAPTURED_AT" | sed -E 's/\.[0-9]+ / /')
            if EPOCH=$(date -j -f "%Y-%m-%d %H:%M:%S %z" "$NORMALIZED" +%s 2>/dev/null); then
              if [ "$EPOCH" -lt "$START_EPOCH" ]; then
                CAPTURED=stale
              else
                CAPTURED=current
              fi
            fi
          fi
          if [ "$CAPTURED" = "stale" ]; then
            # 除外した report も、report が無かったのか古い report だったのかを追えるよう残す
            STALE=$((STALE + 1))
            echo "Excluded stale report: $REPORT (captured at $CAPTURED_AT)"
            continue
          fi
          if [ "$CAPTURED" = "unknown" ]; then
            UNKNOWN=$((UNKNOWN + 1))
          fi
          # xctest / Sora の report だけを抽出する。report とプロセス起動を対応づけられるよう
          # procLaunch / pid を、crash と hang を区別できるよう bugType も出力する。
          # 出力の有無で「対象の report か」「表示できたか」を分けて数える
          if ! OUTPUT=$(jq --arg report "$REPORT" --arg capturedAt "${CAPTURED_AT:-unknown}" '
            select(.threads? != null) |
            select(.procName == "xctest" or ((.procName // "") | startswith("Sora"))) |
            . as $crash |
            {
              report: $report,
              process: .procName,
              capturedAt: $capturedAt,
              pid: .pid,
              procLaunch: .procLaunch,
              bugType: .bug_type,
              exception: (.exception | {type, signal, codes}),
              termination: (.termination | {namespace, code, indicator}),
              faultingThread: .faultingThread,
              faultingThreadQueue: (
                if .faultingThread != null and .faultingThread < (.threads | length)
                then .threads[.faultingThread].queue
                else null
                end
              ),
              # faultingThread を持たない report (ハングなど) でも report 全体を捨てない
              frames: [
                (.threads[.faultingThread]?.frames // [])[]? |
                {image: $crash.usedImages[.imageIndex].name, symbol, symbolLocation}
              ],
              # クラッシュがテスト本体か tearDown かを判定できるよう、main thread の先頭
              # フレームを出す。run loop のフレームの後ろにテストのフレームが現れることがある
              # ため 15 frame まで出す。faulting thread が main thread の場合は frames と
              # 重複するので出さない
              mainThreadFrames: (
                if .faultingThread != null
                  and (.threads[.faultingThread]?.queue == "com.apple.main-thread")
                then []
                else
                  [
                    .threads[] |
                    select(.queue == "com.apple.main-thread" or .name == "main") |
                    .frames[0:15][]? |
                    {image: $crash.usedImages[.imageIndex].name, symbol}
                  ] | .[0:15]
                end
              )
            }
          ' "$report"); then
            echo "Warning: failed to print $REPORT"
            FAILED=$((FAILED + 1))
            continue
          fi
          if [ -z "$OUTPUT" ]; then
            # 対象外の process (Simulator など) の report。job 中の crash として参考になるため数える
            OTHER=$((OTHER + 1))
            continue
          fi
          printf '%s\n' "$OUTPUT"
          TARGET=$((TARGET + 1))
        done < <(find build/e2e-diagnostics -type f -name '*.ips' -print0)

        echo "crash diagnostics: $TOTAL report(s), $STALE stale, $UNKNOWN unknown time, $TARGET xctest / Sora, $OTHER other process, $FAILED failed"
        if [ "$TARGET" -eq 0 ]; then
          echo "note: no xctest / Sora crash report was printed"
        fi
    - name: Shutdown Simulator
      if: always()
      run: xcrun simctl shutdown 'iPhone 17 Pro' || true
  tsan:
    runs-on: [self-hosted, macOS, ARM64, Apple-M1]
    # 実測はクリーンビルド 16 秒 + 全件実行 32 秒の約 1 分であり、cold cache を見込んで 20 分にする。
    timeout-minutes: 20
    env:
      XCODE: /Applications/Xcode.app
      XCODE_SDK: iphoneos26.5
      DESTINATION: platform=iOS Simulator,name=iPhone 17 Pro,OS=26.5
      SORA_SIGNALING_URL: ${{ secrets.TEST_SIGNALING_URL }}
      TEST_SECRET_KEY: ${{ secrets.TEST_SECRET_KEY }}
      TEST_CHANNEL_ID_PREFIX: ${{ secrets.TEST_CHANNEL_ID_PREFIX }}
      # 同じ run の e2e job と tsan job が同じチャンネル ID へ接続すると、片方の接続が
      # TIMEOUT で close されてテストが失敗することがあるため、job ごとに分ける
      TEST_CHANNEL_ID_SUFFIX: _${{ github.run_id }}_tsan
      TEST_API_URL: ${{ secrets.TEST_API_URL }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Show Xcode Version
      run: xcodebuild -version
    - name: Setup iOS Simulator
      run: |
        SIMULATOR_NAME="iPhone 17 Pro"

        # デバイスの存在を確認し、存在しなければ作成する
        if ! xcrun simctl list devices available | grep -q "$SIMULATOR_NAME ("; then
          echo "Creating simulator '$SIMULATOR_NAME'"
          xcrun simctl create "$SIMULATOR_NAME" \
            "com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro"
        fi

        # 起動
        xcrun simctl boot "$SIMULATOR_NAME"
        xcrun simctl bootstatus "$SIMULATOR_NAME" -b
    - name: Run Thread Sanitizer Tests
      id: tsan_tests
      env:
        # 判定の grep が 0 行のときに exit 1 になるため、pipe の exit code は判定より先に
        # 変数へ取り出す。race を検出した TSan はプロセスを BUS で終了させるため非 0 になり、
        # grep だけに依存しない失敗条件として使う。
        # 接続情報を含む通常のログは artifact へ持ち出さず、report の抽出はこの step で行う。
        REPORT_PATH: build/tsan-report.txt
        # report は一度 EXTRACT_PATH へ抽出し、report が 0 件のときは REPORT_PATH を作らない
        EXTRACT_PATH: build/tsan-report.extract.txt
      run: |
        # build と bundle の検査など、途中の失敗で step を終了させる
        set -eo pipefail

        # incremental build では TSan runtime の bundle への複製が省略されるため、先に build を消す
        rm -rf build

        # TSan runtime を .xctest bundle へ複製させるため、build から行う
        # (test-without-building では TSan runtime が load されず race を検出しない)
        xcodebuild build-for-testing \
          -scheme Sora-Package \
          -sdk ${{ env.XCODE_SDK }} \
          -derivedDataPath build \
          -enableThreadSanitizer YES \
          -destination '${{ env.DESTINATION }}' \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY= \
          PROVISIONING_PROFILE= \
          SWIFT_VERSION=6

        # destination と同じ Simulator の UDID を取る (booted が複数ある場合があるため、
        # 名前と OS で特定する)
        UDID=$(xcrun simctl list devices booted --json |
          python3 -c "
        import json, sys

        devices = json.load(sys.stdin)['devices']
        for runtime, device_list in devices.items():
            if 'iOS-26-5' not in runtime:
                continue
            for device in device_list:
                if device['name'] == 'iPhone 17 Pro' and device.get('state') == 'Booted':
                    print(device['udid'])
                    sys.exit(0)
        ")
        if [ -z "$UDID" ]; then
          echo "Error: iPhone 17 Pro (iOS 26.5) の booted device が見つかりません"
          exit 1
        fi
        echo "UDID: $UDID"

        BUNDLE="$PWD/build/Build/Products/Debug-iphonesimulator/SoraTests.xctest"
        if [ ! -d "$BUNDLE" ]; then
          echo "Error: $BUNDLE が見つかりません"
          exit 1
        fi

        # simctl spawn は親の環境変数を渡さないため、TSan の DYLD_* と E2E の環境変数は
        # どちらも SIMCTL_CHILD_ 接頭辞で渡す
        # WebRTC の prebuilt モジュールが RTCPeerConnectionFactory の生成時に作るスレッドは
        # SDK 側から join できない。プロセス終了時に thread leak として報告されると
        # Check Thread Sanitizer Report step が job を失敗させるため、その報告だけを止める
        # (report_thread_leaks=0)。データ競合の検出条件は変えない。
        # set -e は pipeline が非 0 を返した時点で shell を終了させるため、exit code を
        # 取り出す間だけ無効化する (race を検出した TSan はプロセスを BUS で終了させ、
        # pipeline の exit code は非 0 になる)。
        set +e
        SIMCTL_CHILD_DYLD_FRAMEWORK_PATH="$PWD/build/Build/Products/Debug-iphonesimulator" \
        SIMCTL_CHILD_DYLD_INSERT_LIBRARIES="$BUNDLE/Frameworks/libclang_rt.tsan_iossim_dynamic.dylib" \
        SIMCTL_CHILD_TSAN_OPTIONS=verbosity=1:report_thread_leaks=0 \
        SIMCTL_CHILD_SORA_SIGNALING_URL="$SORA_SIGNALING_URL" \
        SIMCTL_CHILD_TEST_SECRET_KEY="$TEST_SECRET_KEY" \
        SIMCTL_CHILD_TEST_CHANNEL_ID_PREFIX="$TEST_CHANNEL_ID_PREFIX" \
        SIMCTL_CHILD_TEST_CHANNEL_ID_SUFFIX="$TEST_CHANNEL_ID_SUFFIX" \
        SIMCTL_CHILD_TEST_API_URL="$TEST_API_URL" \
          xcrun simctl spawn "$UDID" \
            "$(xcode-select -p)/Platforms/iPhoneSimulator.platform/Developer/Library/Xcode/Agents/xctest" \
            "$BUNDLE" 2>&1 | tee build/tsan.log

        # pipefail により pipeline の exit code がそのまま入る。
        # pipeline の直後で取り出す (grep は「0 行」のとき exit 1 になるため、
        # そのままでは job の成否に使えない)。
        TSAN_EXIT_CODE=$?
        set -e

        # 異常終了した場合の証跡として、log の末尾にも exit code と実行結果を残す
        echo "tsan exit code: $TSAN_EXIT_CODE" >> build/tsan.log
        echo "tsan_exit_code=$TSAN_EXIT_CODE" >> "$GITHUB_ENV"

        # artifact には log 全体ではなく TSan の report ブロックだけを入れる。
        # report は「WARNING: ThreadSanitizer」の行から「==================」の行までで、
        # 接続情報や環境変数を含む通常のログ行は持ち出さない。
        # simulator と xctest の出力が交錯すると、log に UTF-8 として解釈できない
        # バイト列が残る。macOS の awk は UTF-8 locale でそれを変換しようとして towc に
        # 失敗するため、locale を C に固定して log をバイト列として扱う。
        # 抽出の失敗で step を終了させない (失敗条件の判定は Check Thread Sanitizer Report
        # step が持つため、ここで終了させると report の判定が失われる)。
        EXTRACT_STATUS=0
        LC_ALL=C awk '
          /^WARNING: ThreadSanitizer/ { in_report = 1; print; next }
          in_report { print }
          in_report && /^==================$/ { in_report = 0 }
        ' build/tsan.log > "$EXTRACT_PATH" || EXTRACT_STATUS=$?
        if [ "$EXTRACT_STATUS" -ne 0 ]; then
          echo "警告: TSan report の抽出に失敗しました (awk exit $EXTRACT_STATUS)。report は artifact に含まれないことがあります。"
        fi

        TSAN_REPORT_COUNT=$(LC_ALL=C grep -c '^WARNING: ThreadSanitizer' "$EXTRACT_PATH" || true)
        TSAN_REPORT_COUNT=${TSAN_REPORT_COUNT:-0}
        if [ "$TSAN_REPORT_COUNT" -gt 0 ]; then
          mv "$EXTRACT_PATH" "$REPORT_PATH"
        else
          # report が 0 件のときは file を作らない (Upload TSan Report step の
          # if-no-files-found: ignore により、file が無ければ artifact も作られない)
          rm -f "$EXTRACT_PATH" "$REPORT_PATH"
        fi
        echo "tsan_report_count=$TSAN_REPORT_COUNT" >> "$GITHUB_ENV"
        echo "TSan report count: $TSAN_REPORT_COUNT (log: build/tsan.log)"
    - name: Check Thread Sanitizer Report
      env:
        REPORT_PATH: build/tsan-report.txt
      run: |
        # grep は「0 行」のとき exit 1 になるため、行数は先に数える。
        # verbosity=1 では banner と parsing の行にも ThreadSanitizer が現れるため、
        # race の判定には「ThreadSanitizer」の単純な行数を使わない。
        REPORT_COUNT=${tsan_report_count:-0}
        EXIT_CODE=${tsan_exit_code:-1}
        if [ "$REPORT_COUNT" -gt 0 ]; then
          echo "Error: Thread Sanitizer がデータ競合を $REPORT_COUNT 件報告しました。"
          cat "$REPORT_PATH"
          exit 1
        fi

        # interceptor が有効でなければ「検出 0」は空振りである
        # (DYLD_INSERT_LIBRARIES の path 誤りや TSan 無効 build を検出する)
        if ! grep -q '\*\*\*\*\* Running under ThreadSanitizer' build/tsan.log; then
          echo "Error: TSan runtime が load されていません (interceptor 無効のため検出 0 は空振りです)。"
          exit 1
        fi

        # test 数が 0 件でないことを確認する (bundle の path 誤りでも 0 件で終了し得る)。
        # XCTest は suite ごとに "Executed N tests" を出すため、最も外側の suite の値
        # (最大値) を全体の test 数として使う。合計すると suite の入れ子の分だけ重複する。
        TEST_COUNT=$(grep -o 'Executed [0-9]* tests\?' build/tsan.log |
          awk '{ if ($2 > max) max = $2 } END { print max + 0 }')
        if [ -z "$TEST_COUNT" ] || [ "$TEST_COUNT" -eq 0 ]; then
          echo "Error: 実行した test 数が 0 件です。"
          exit 1
        fi
        echo "Executed tests: $TEST_COUNT"

        # race を検出した TSan はプロセスを BUS で終了させるため、exit code も失敗条件にする
        if [ "$EXIT_CODE" -ne 0 ]; then
          echo "Error: TSan 実行の exit code が $EXIT_CODE です。"
          exit 1
        fi

        echo "Thread Sanitizer: no data race detected ($TEST_COUNT tests)"
    - name: Upload TSan Report
      if: failure()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: tsan-report
        path: build/tsan-report.txt
        if-no-files-found: ignore
    - name: Shutdown Simulator
      if: always()
      run: xcrun simctl shutdown 'iPhone 17 Pro' || true
  slack_notify:
    needs: [e2e, tsan]
    runs-on: ubuntu-slim
    if: always()
    permissions:
      actions: read
    steps:
      - name: Slack Notification
        uses: shiguredo/github-actions/.github/actions/slack-notify@main
        with:
          # 真偽値では failure_and_fixed の判定で通知がスキップされるため、結果文字列へ畳んで渡す
          status: ${{ contains(needs.*.result, 'failure') && 'failure' || contains(needs.*.result, 'cancelled') && 'cancelled' || 'success' }}
          slack_webhook: ${{ secrets.SLACK_WEBHOOK }}
          slack_channel: sora-ios-sdk
        env:
          GH_TOKEN: ${{ github.token }}
