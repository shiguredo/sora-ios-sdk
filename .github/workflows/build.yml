name: Build

on:
  workflow_dispatch:
  push:
    paths-ignore:
    - '**.md'
    - 'LICENSE'
    - 'TestConsumers/**'

jobs:
  build:
    runs-on: macos-26
    env:
      XCODE: /Applications/Xcode_26.6.app
      XCODE_SDK: iphoneos26.5
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Select Xcode Version
      run: sudo xcode-select -s '${{ env.XCODE }}/Contents/Developer'
    - name: Show Xcode Version
      run: xcodebuild -version
    - name: Build Xcode Project
      run: |
        set -o pipefail && \
          xcodebuild \
            -scheme 'Sora' \
            -sdk ${{ env.XCODE_SDK }} \
            -configuration Release \
            -derivedDataPath build \
            -destination 'generic/platform=iOS' \
            clean build \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            PROVISIONING_PROFILE= \
            SWIFT_VERSION=6
    - name: Check WebRTC Non-public API
      run: |
        WEBRTC_FRAMEWORK=$(find build -name "WebRTC.framework" -path "*/WebRTC.xcframework/ios-arm64/*" | head -1)
        if [ -n "$WEBRTC_FRAMEWORK" ] && nm "$WEBRTC_FRAMEWORK/WebRTC" | grep _kVTVideoEncoderSpecification_RequiredLowLatency >/dev/null 2>&1; then
          echo 'Error: Non-public API detected in WebRTC framework.'
          exit 1
        fi
    - name: Format Lint
      run: |
        make fmt-lint
    - name: Lint
      run: |
        make lint
    - name: Check No @preconcurrency Import in SoraTests
      run: |
        set -o pipefail
        # SoraTests が @preconcurrency で concurrency 診断を抑止していないことを検査する。
        # @preconcurrency を付けると診断が error にならなくなり、build の成否では再追加を
        # 検出できないため、ソースの文字列で検査する。
        # pathspec が 0 件に一致したまま成功しないよう、先に対象のファイル数を確認する
        count=$(git ls-files -- ':(glob)SoraTests/**/*.swift' | wc -l | tr -d ' ')
        if [ "$count" -eq 0 ]; then
          echo 'Error: the pathspec matches no tracked file under SoraTests.'
          exit 1
        fi
        # 許容するのはコメント行と @preconcurrency import Accelerate (C API の注釈不足を補うため)
        # だけである。属性を単独行に書いた形も検出できるよう、行の形には依存させない。
        # 新しい抑止が必要になった場合は、この step の許容条件を見直すこと
        set +e
        found=$(git grep -n -E '@preconcurrency' -- ':(glob)SoraTests/**/*.swift')
        status=$?
        set -e
        if [ "$status" -ne 0 ] && [ "$status" -ne 1 ]; then
          echo "Error: git grep failed (exit $status)."
          exit 1
        fi
        violations=$(
          printf '%s\n' "$found" \
            | grep -v -E ':[0-9]+:[[:space:]]*//' \
            | grep -v -E '@preconcurrency[[:space:]]+import[[:space:]]+Accelerate$' \
            | grep -v '^$' || true
        )
        if [ -n "$violations" ]; then
          echo 'Error: SoraTests must not use @preconcurrency except for import Accelerate.'
          echo "$violations"
          exit 1
        fi
  slack_notify:
    needs: [build]
    runs-on: ubuntu-24.04
    if: always()
    permissions:
      actions: read
    steps:
      - name: Slack Notification
        uses: shiguredo/github-actions/.github/actions/slack-notify@main
        with:
          status: ${{ job.status }}
          slack_webhook: ${{ secrets.SLACK_WEBHOOK }}
          slack_channel: sora-ios-sdk
