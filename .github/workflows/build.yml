name: Build

on:
  workflow_dispatch:
  push:
    paths-ignore:
    - '**.md'
    - 'LICENSE'

jobs:
  build:
    runs-on: macos-26
    env:
      XCODE: /Applications/Xcode_26.2.app
      XCODE_SDK: iphoneos26.2
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Select Xcode Version
      run: sudo xcode-select -s '${{ env.XCODE }}/Contents/Developer'
    - name: Show Xcode Version
      run: xcodebuild -version
    - name: Build Xcode Project
      run: |
        set -o pipefail && \
          xcodebuild \
            -scheme 'Sora' \
            -sdk ${{ env.XCODE_SDK }} \
            -configuration Release \
            -derivedDataPath build \
            -destination 'generic/platform=iOS' \
            clean build \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            PROVISIONING_PROFILE= \
            SWIFT_VERSION=6
    - name: Check WebRTC Non-public API
      run: |
        WEBRTC_FRAMEWORK=$(find build -name "WebRTC.framework" -path "*/WebRTC.xcframework/ios-arm64/*" | head -1)
        if [ -n "$WEBRTC_FRAMEWORK" ] && nm "$WEBRTC_FRAMEWORK/WebRTC" | grep _kVTVideoEncoderSpecification_RequiredLowLatency >/dev/null 2>&1; then
          echo 'Error: Non-public API detected in WebRTC framework.'
          exit 1
        fi
    - name: Format Lint
      run: |
        make fmt-lint
    - name: Lint
      run: |
        make lint
  # 外部の consumer と同じ形で Sora を import した fixture を、最低要件の Xcode と
  # 公開 API baseline を生成した Xcode の両方で検証する
  consumer-fixture:
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        include:
        - xcode: /Applications/Xcode_26.2.app
          sdk: iphoneos26.2
        - xcode: /Applications/Xcode_26.6.app
          sdk: iphoneos26.5
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Select Xcode Version
      run: sudo xcode-select -s '${{ matrix.xcode }}/Contents/Developer'
    - name: Show Xcode Version
      run: |
        xcodebuild -version
        ls /Applications | grep Xcode
        cd Fixtures/Swift6Consumer && xcodebuild -list
    - name: Build ConsumerCore
      run: |
        set -o pipefail && \
          make consumer-build SCHEME=ConsumerCore XCODE=${{ matrix.xcode }} XCODE_SDK=${{ matrix.sdk }} \
            2>&1 | tee consumer-core.log
    - name: Build ConsumerUI
      run: |
        set -o pipefail && \
          make consumer-build SCHEME=ConsumerUI XCODE=${{ matrix.xcode }} XCODE_SDK=${{ matrix.sdk }} \
            2>&1 | tee consumer-ui.log
    - name: Build ConsumerLegacy
      run: |
        set -o pipefail && \
          make consumer-build SCHEME=ConsumerLegacy XCODE=${{ matrix.xcode }} XCODE_SDK=${{ matrix.sdk }} \
            2>&1 | tee consumer-legacy.log
    # 各 target の設定 (warnings-as-errors と既定隔離) が compiler まで届いていることを、
    # 実際の build ログに現れる flag で確認する。設定が無言で消えると gate が弱くなるため
    - name: Check Compiler Settings
      run: |
        for log in consumer-core.log consumer-legacy.log consumer-ui.log; do
          if ! grep -Fq -- '-warnings-as-errors' "$log"; then
            echo "Error: '-warnings-as-errors' is missing in $log."
            exit 1
          fi
        done
        if ! grep -Fq -- '-default-isolation nonisolated' consumer-core.log; then
          echo "Error: '-default-isolation nonisolated' is missing in consumer-core.log."
          exit 1
        fi
        if ! grep -Fq -- '-default-isolation MainActor' consumer-ui.log; then
          echo "Error: '-default-isolation MainActor' is missing in consumer-ui.log."
          exit 1
        fi
        if ! grep -Fq -- '-Wwarning DeprecatedDeclaration' consumer-legacy.log; then
          echo "Error: '-Wwarning DeprecatedDeclaration' is missing in consumer-legacy.log."
          exit 1
        fi
    # ConsumerLegacy が実際に非推奨 API の warning を出していることを symbol 名で確認する。
    # 件数ではなく symbol 名で見るのは、Xcode の版で warning の行数が変わり得るため。
    # fixture の非推奨 API の参照を増減する作業は、この一覧も同時に更新する
    - name: Check Deprecation Warning
      run: |
        for symbol in TLSSecurityPolicy tlsSecurityPolicy onDisconnectLegacy onReceiveSignaling simulcastRid spotlightEnabled; do
          if ! grep -Fq -- "'$symbol' is deprecated" consumer-legacy.log; then
            echo "Error: deprecation warning for '$symbol' is missing in the ConsumerLegacy build log."
            exit 1
          fi
        done
    - name: Check Negative Checks
      run: |
        make consumer-check-negative XCODE=${{ matrix.xcode }} XCODE_SDK=${{ matrix.sdk }}
    - name: Check No Test-Only Import
      run: |
        if git grep -n -E '@testable|@preconcurrency' -- ':(glob)Fixtures/Swift6Consumer/**/*.swift'; then
          echo 'Error: the consumer fixture must not use test-only or diagnostic-suppressing imports.'
          exit 1
        fi
    # baseline は dump に使った Xcode と SDK の module とだけ比較できる
    - name: Check Public API Baseline
      if: matrix.sdk == 'iphoneos26.5'
      run: |
        make api-check XCODE=${{ matrix.xcode }} XCODE_SDK=${{ matrix.sdk }}
  slack_notify:
    needs: [build, consumer-fixture]
    runs-on: ubuntu-24.04
    if: always()
    permissions:
      actions: read
    steps:
      - name: Slack Notification
        uses: shiguredo/github-actions/.github/actions/slack-notify@main
        with:
          status: ${{ (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) && 'failure' || 'success' }}
          slack_webhook: ${{ secrets.SLACK_WEBHOOK }}
          slack_channel: sora-ios-sdk
